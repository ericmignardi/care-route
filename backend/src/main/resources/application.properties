spring.application.name=careroute
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_DB:careroute}
spring.datasource.username=${DATABASE_USER:careroute}
spring.datasource.password=${DATABASE_PASSWORD:careroute}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# NFR-4 - list endpoints default to 20 and are hard-capped at 100 regardless of what the client asks for
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

security.jwt.secret-key=${JWT_SECRET_KEY:mySecretKeyMustBeAtLeast32BytesLongToSatisfyHmacSha256Requirements}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# BR-4 - how far either side of the scheduled start a check-in is accepted
app.scheduling.check-in-tolerance-minutes=${VISIT_CHECK_IN_TOLERANCE_MINUTES:30}
app.scheduling.zone-id=${APP_TIME_ZONE:America/Toronto}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
