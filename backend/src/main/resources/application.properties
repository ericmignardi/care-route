spring.application.name=careroute
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_DB:careroute}
spring.datasource.username=${DATABASE_USER:careroute}
spring.datasource.password=${DATABASE_PASSWORD:careroute}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret-key=${JWT_SECRET_KEY:mySecretKeyMustBeAtLeast32BytesLongToSatisfyHmacSha256Requirements}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
