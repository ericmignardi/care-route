# The datasource is supplied by the Testcontainers Postgres in AbstractIntegrationTest via
# @DynamicPropertySource, so nothing here points at a database.
app.cors.allowed-origins=http://localhost:5173

# BR-4's tolerance is pinned rather than inherited, so the boundary tests stay meaningful if
# the deployed default is ever retuned.
app.scheduling.check-in-tolerance-minutes=30
app.scheduling.zone-id=America/Toronto

spring.jpa.show-sql=false
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
