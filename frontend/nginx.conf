server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Vite fingerprints every filename under /assets, so those files are immutable by
    # construction and can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached: it is the only file whose name does not change,
    # so a stale copy pins the browser to a deleted asset bundle after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The SPA fallback. /clients/3f2a is a client-side route, not a file — without this
    # every deep link and every hard refresh away from / returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
